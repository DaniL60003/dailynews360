name: Daily news

on:

  workflow_dispatch:

  schedule:

    - cron: '0 5,6 * * *'

permissions:

  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - id: clock

        run: echo "hour=$(TZ=Europe/Sofia date +%H)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5

        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '08'

        with:

          python-version: '3.12'

      - if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '08'

        run: |

          pip install feedparser

          python update.py

          git config user.name 'Daily News Bot'

          git config user.email 'actions@users.noreply.github.com'

          git add archive editions.json

          git diff --cached --quiet || (git commit -m 'Update news' && git push)
