name: Daily news

on:

  workflow_dispatch:

  schedule:

    - cron: '0 5,6 * * *'

permissions:

  contents: write

  pages: write

  id-token: write

concurrency:

  group: dailynews360

  cancel-in-progress: false

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - id: clock

        run: echo "hour=$(TZ=Europe/Sofia date +%H)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5

        with:

          python-version: '3.12'

      - name: Collect news

        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.hour == '08'

        run: |

          pip install feedparser

          python update.py

          git config user.name 'Daily News Bot'

          git config user.email 'actions@users.noreply.github.com'

          git add archive editions.json

          git diff --cached --quiet || (git commit -m 'Update news' && git push)

      - uses: actions/configure-pages@v5

      - name: Prepare website

        run: |

          mkdir -p _site

          cp index.html editions.json _site/

          cp -r archive _site/

      - uses: actions/upload-pages-artifact@v3

        with:

          path: _site

  deploy:

    needs: update

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publish website

        id: deployment

        uses: actions/deploy-pages@v4
