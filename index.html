<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily News 360</title><style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#17233a}main,header{max-width:1100px;margin:auto;padding:24px}header{border-bottom:3px solid #315d91}h1{font-size:clamp(32px,7vw,60px);margin:12px 0}small{opacity:.7}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:inherit}button,select{font:inherit;padding:10px;border:1px solid #aaa;border-radius:8px;background:transparent;color:inherit}#news{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}section{background:white;padding:20px;border-radius:12px}article{border-top:1px solid #aaa5;padding:16px 0}article a{font-weight:700;text-decoration:none}article a:hover{text-decoration:underline}body.dark{background:#121923;color:#e4e9f0}body.dark section{background:#202b39}p{line-height:1.5}</style><header><small>ПЕРСОНАЛЬНЫЙ НОВОСТНОЙ ПОРТАЛ</small><h1>Daily News 360</h1><nav><select id="edition" aria-label="Архив"></select><button id="theme">Светлая / тёмная</button></nav><p id="status">Ожидание первого выпуска</p></header><main><div id="news"></div></main><script>const names=['Мир','Европа и геополитика','Израиль и Ближний Восток','Болгария','Экономика и бизнес','Технологии и связь'];const $=id=>document.getElementById(id);function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}function render(data){$('news').replaceChildren();names.forEach((name,n)=>{let s=el('section','');s.append(el('h2',name));let items=data?.sections?.[n]||[];if(!items.length)s.append(el('p','Нет проверенных свежих публикаций.'));items.forEach(i=>{let a=el('article',''),l=el('a',i.title);l.href=i.url;l.target='_blank';l.rel='noopener noreferrer';a.append(l,el('p',i.summary),el('small',i.source+' · '+new Date(i.date).toLocaleString('ru-RU',{timeZone:'Europe/Sofia'})));s.append(a)});$('news').append(s)})}async function load(){try{let r=await fetch('archive/'+$('edition').value+'.json');if(!r.ok)throw Error();let d=await r.json();render(d);$('status').textContent='Обновлено: '+new Date(d.updated).toLocaleString('ru-RU',{timeZone:'Europe/Sofia'})+' (Болгария)'}catch{render(null);$('status').textContent='Выпуск пока недоступен'}}$('edition').onchange=load;$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'};if(localStorage.theme==='dark')document.body.classList.add('dark');render(null);fetch('editions.json').then(r=>r.json()).then(ds=>{ds.forEach(d=>{let o=el('option',d);o.value=d;$('edition').append(o)});if(ds.length)load()}).catch(()=>{});</script></html>
